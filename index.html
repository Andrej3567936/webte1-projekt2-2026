<!-- 
    BOOTSTRAP -> classy pri prvkoch: 
        m / p -> margin / padding
        t / b / s / e -> top / bottom / start / end
        x / y -> horizontal (vlavo aj v pravo spolu) / vertical (hore dole spolu)
        bez pismena -> vsetkymi smermi
        cislo (0-5) -> velkost 1 2 3 4 5

        d-flex -> posklada deti vedla seba
        flex-wrap -> povolí zalomenie
        justify-content-between -> roztiahne do kraja
        gap-2 -> medzera mezi nimi
        text-end -> zarovná text doprava
        text-nowrap -> zakaze zalamovanie
        d-none -> skryje prvok
        d-block -> zobrazi prvok ako blok
        container -> vycentruje obsah a obmedzi sirku

-->

<!doctype html>
<html lang="sk" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Where2Eat | Obedové menu v okolí FEI</title>
    <meta
      name="descripti                  on"
      content="Denné menu reštaurácií v okolí FEI STU na jednom mieste."
    />
    <link rel="icon" type="image/png" href="favicon_p.png" />

    <!-- Bootstrap (CSS knižnica) -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <!-- vlastné štýly až po Bootstrape, aby ich mohli prepísať -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header>
      <!-- navbar-expand-md: na mobile sa menu zbalí do hamburgera -->
      <nav class="navbar navbar-expand-md bg-body-tertiary">
        <div class="container">
          <a class="navbar-brand" href="index.html">Where2Eat</a>
          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="collapse"
            data-bs-target="#main-nav"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="main-nav">
            <ul class="navbar-nav ms-auto">
              <li class="nav-item">
                <a class="nav-link active" href="index.html">Menu</a>
              </li>
              <li class="nav-item">
                <a class="nav-link" href="docs/about_project.html"
                  >O projekte</a
                >
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>

    <main class="container my-4">
      <h1 class="h2 mb-3">Obedové menu v okolí fakulty</h1>

      <!-- tlačidlá na obnovu a vymazanie dát -->
      <section class="mb-3 d-flex flex-wrap gap-2">
        <button type="button" class="btn btn-primary" id="btn-update">
          Aktualizovať menu
        </button>
        <button type="button" class="btn btn-outline-danger" id="btn-clear">
          Vymazať uložené dáta
        </button>
      </section>

      <!-- výber dňa (JS prepína triedu active) -->
      <nav class="mb-3">
        <ul class="nav nav-pills flex-wrap gap-1" id="day-tabs">
          <li class="nav-item">
            <button type="button" class="nav-link" data-day="1">Pondelok</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-day="2">Utorok</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-day="3">Streda</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-day="4">Štvrtok</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-day="5">Piatok</button>
          </li>
          <li class="nav-item">
            <button type="button" class="nav-link" data-day="week"> Celý týždeň</button>
          </li>
        </ul>
      </nav>

      <!-- filter reštaurácií (zaškrtávacie políčka doplní JS) -->
      <fieldset class="mb-4">
        <legend class="fs-6">Zobraziť reštaurácie:</legend>
        <div id="restaurant-filter" class="d-flex flex-wrap gap-3"></div>
      </fieldset>

      <p id="weekend-msg" class="alert alert-info d-none">
        Cez víkend menu nie je k dispozícii, zobrazený je pondelok.
      </p>
      <!-- indikátor načítavania; d-none = skryté -->
      <div id="loading" class="text-center my-5 d-none">
        <div class="spinner-border" role="status">
          <span class="visually-hidden">Načítavam…</span>
        </div>
        <p class="mt-2">Načítavam menu…</p>
      </div>

      <!-- sem JS vykreslí karty reštaurácií -->
      <section id="menu" class="row g-4"></section>
    </main>

    <footer class="bg-body-tertiary py-3 mt-5">
      <div class="container text-center small">
        <p class="mb-1 mt-4">&copy; 2026 Andrej Hudačko</p>
        <p class="mb-4">
          Použité knižnice: Bootstrap 5.3.3, jQuery 3.7.1 | Dáta: weby
          reštaurácií
        </p>
      </div>
    </footer>

    <!-- jQuery a Bootstrap (JS) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- vlastný kód; poradie: parsery, ukladanie, hlavná logika -->
    <script src="js/parsers.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
